version: 2.1

# 原计划部署、只跑樱花：从上游 CloudCheckin 精简而来，
# 删除了 nodeseek / v2ex / onepoint3acres / deepflood 四个 job，只留 sakurafrp。
# 定时触发不在这里：Cloudflare Worker 每天定时 POST CircleCI 的 custom webhook，
# webhook 再触发本文件里的 manual_trigger workflow。

commands:
  notify-job-failure:
    parameters:
      source:
        type: string
    steps:
      - run:
          name: Notify Telegram about << parameters.source >> failure
          when: on_fail
          command: |
            marker="/tmp/cloudcheckin-telegram-notified"
            if [ -f "$marker" ]; then
              echo "A platform notification was already sent; skipping fallback"
              exit 0
            fi

            telegram_token=$(printf '%s' "$TELEGRAM_TOKEN" | tr -d '\r\n')
            telegram_chat_id=$(printf '%s' "$TELEGRAM_CHAT_ID" | tr -d '\r\n')
            if [ -z "$telegram_token" ] || [ -z "$telegram_chat_id" ]; then
              echo "Telegram configuration is incomplete; cannot send failure fallback"
              exit 0
            fi

            timestamp=$(TZ=Asia/Shanghai date '+%Y/%m/%d %H:%M:%S')
            message="${timestamp}
            << parameters.source >>
            CircleCI job failed before a platform notification was sent.
            ${CIRCLE_BUILD_URL}"

            curl --fail --silent --show-error \
              --request POST \
              --data-urlencode "chat_id=${telegram_chat_id}" \
              --data-urlencode "text=${message}" \
              "https://api.telegram.org/bot${telegram_token}/sendMessage"

jobs:
  sakurafrp:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install python-dotenv 'httpx[http2]' cryptography openai
      - run:
          name: Run SakuraFrp signin
          command: |
            python -m sakurafrp.sakurafrp
      - notify-job-failure:
          source: SAKURAFRP

workflows:
  # 由 Cloudflare Worker 的 custom webhook 触发（不是 CircleCI 自带的定时）
  manual_trigger:
    jobs:
      - sakurafrp:
          context: checkincontext
